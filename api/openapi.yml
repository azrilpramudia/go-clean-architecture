openapi: 3.0.0
info:
  title: Go Clean Architecture API
  version: 1.0.0
  description: API for user management using clean architecture pattern

servers:
  - url: http://localhost:3000
    description: Local development server

paths:
  /api/users/register:
    post:
      summary: Register a new user
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Validation failed or username already registered
          content:
            text/plain:
              schema:
                type: string
                example: "username already registered"

  /api/users/login:
    post:
      summary: Login and obtain a JWT token
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginUserRequest"
      responses:
        "200":
          description: Login successful, returns JWT token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Validation failed
          content:
            text/plain:
              schema:
                type: string
                example: "Key: 'LoginUserRequest.Username' Error:Field validation for 'Username' failed on the 'required' tag"
        "401":
          description: Username or password is wrong
          content:
            text/plain:
              schema:
                type: string
                example: "username or password is wrong"

  /api/users:
    get:
      summary: Get list of all users
      tags:
        - User
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"
        "401":
          description: Missing, invalid, or expired token
          content:
            text/plain:
              schema:
                type: string
                example: "invalid or expired token"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Send the JWT token obtained from /api/users/login in the format:
        `Authorization: Bearer <token>`

  schemas:
    RegisterUserRequest:
      type: object
      required:
        - username
        - password
        - name
      properties:
        username:
          type: string
          maxLength: 100
          example: burhan
        password:
          type: string
          maxLength: 100
          example: rahasia123
        name:
          type: string
          maxLength: 100
          example: Burhan

    LoginUserRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          maxLength: 100
          example: burhan
        password:
          type: string
          maxLength: 100
          example: rahasia123

    TokenResponse:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjEsInVzZXJuYW1lIjoiYXpyaWwifQ.signature"

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: burhan
        name:
          type: string
          example: Burhan
